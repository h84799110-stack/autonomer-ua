<!doctype html><html><head><script src="https://telegram.org/js/telegram-web-app.js"></script><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Автономер UA</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Onest:wght@400;500;600;700&family=Unbounded:wght@700;800&display=swap">
<style>
/* Layout: one narrow column of asphalt panels, sticky wallet header, bottom tab bar. Single dark look by choice (night road). */
:root{
  --asphalt:#12151a; --panel:#1b1f26; --panel2:#232831; --line:#2c323c;
  --ink:#eceff4; --mute:#8d96a5; --yellow:#ffd23f; --blue:#2c7be5; --flag:#0b4fb3;
  --r0:#98a1b0; --r1:#4fbd7e; --r2:#3d8df5; --r3:#ec5fd2; --r4:#ffc93c; --r5:#ff5a5a;
  --f-body:'Onest',system-ui,-apple-system,'Segoe UI',sans-serif;
  --f-disp:'Unbounded','Onest',system-ui,sans-serif;
  --f-plate:'Barlow Condensed','Arial Narrow',Arial,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--asphalt);color:var(--ink);font:15px/1.45 var(--f-body);-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--asphalt)}
.wrap{max-width:560px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--yellow);outline-offset:2px}

.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--asphalt);border-bottom:1px solid var(--line)}
.row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:12px}
.brand{display:flex;align-items:center;gap:8px;font:800 13px/1 var(--f-disp);letter-spacing:.02em}
.brand i{font-style:normal;background:var(--flag);color:#fff;padding:5px 7px 4px;border-radius:4px;border-bottom:3px solid var(--yellow);font-size:12px}
.wallet{display:flex;align-items:baseline;gap:6px;border:1px solid var(--line);background:var(--panel);border-radius:999px;padding:6px 14px 5px;font:600 21px/1 var(--f-plate);font-variant-numeric:tabular-nums}
.wallet b{color:var(--yellow);font-weight:600}

main{display:grid;gap:16px;padding-block:16px 120px}
main>*{min-width:0}
h2{margin:0;font:700 19px/1.2 var(--f-body)}
.h{margin:0 0 10px;font:600 11px/1 var(--f-body);letter-spacing:.1em;text-transform:uppercase;color:var(--mute)}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:16px}
.hint{margin:0;color:var(--mute);font-size:14px}
.seg{display:flex;gap:4px;background:#0f1216;border:1px solid var(--line);border-radius:10px;padding:4px}
.seg button{flex:1;min-width:0;min-height:40px;border:0;background:none;border-radius:7px;color:var(--mute);font-weight:600;font-size:13px;cursor:pointer;padding:0 4px}
.seg button[aria-pressed="true"]{background:var(--panel2);color:var(--ink)}

/* plate */
.plate{container-type:inline-size;width:100%;max-width:420px;margin-inline:auto}
.frm{border-radius:3.6cqw}
.plate[data-f] .frm{padding:1.6cqw;box-shadow:0 0 5cqw -2cqw rgba(255,255,255,.35)}
.plate[data-f="0"] .frm{background:linear-gradient(135deg,#c9d1dc,#69737f 55%,#b8c1cd)}
.plate[data-f="1"] .frm{background:linear-gradient(135deg,#e6ab70,#8a5527 55%,#dba06a)}
.plate[data-f="2"] .frm{background:linear-gradient(135deg,#ffe58a,#b8860b 55%,#ffd860)}
.plate[data-f="3"] .frm{background:linear-gradient(135deg,#f7fbff,#8ea4c4 55%,#e7f0ff)}
.plate[data-f="4"] .frm{background:conic-gradient(from 20deg,#6ee7ff,#c9a7ff,#ff9ed2,#ffe27a,#7bffc1,#6ee7ff)}
.pl{position:relative;overflow:hidden;display:grid;grid-template-columns:11cqw 1fr;aspect-ratio:4.6/1;background:#f5f5f0;border:.7cqw solid #16181c;border-radius:2.4cqw;box-shadow:0 .6cqw 1.6cqw rgba(0,0,0,.45),0 0 7cqw -1cqw var(--glow,transparent)}
.plate:not([data-t="0"]){--glow:var(--rc)}
.plate[data-t="4"] .pl,.plate[data-t="5"] .pl{box-shadow:0 .6cqw 1.6cqw rgba(0,0,0,.45),0 0 10cqw 0 var(--rc)}
.band{background:var(--flag);display:flex;flex-direction:column;align-items:center;justify-content:space-between;padding:2cqw 0 1.6cqw;color:#fff}
.band .flag{display:block;width:5.4cqw;height:3.6cqw;background:linear-gradient(180deg,#2f7de1 50%,#ffd500 50%);border-radius:.3cqw}
.band b{font:700 3.8cqw/1 var(--f-plate);letter-spacing:.06em}
.txt{display:flex;align-items:center;justify-content:center;gap:2.6cqw;font:600 20.5cqw/1 var(--f-plate);color:#111;padding-top:.8cqw;white-space:nowrap}
.plate[data-t="4"] .pl::after,.plate[data-t="5"] .pl::after{content:"";position:absolute;inset:0;background:linear-gradient(105deg,transparent 38%,rgba(255,255,255,.7) 50%,transparent 62%);transform:translateX(-110%);animation:shine 3.2s ease-in-out infinite}
.plate[data-t="5"] .pl{border-color:var(--r5)}
@keyframes shine{60%,100%{transform:translateX(110%)}}
.plate.pop{animation:pop .35s cubic-bezier(.2,.8,.3,1)}
.plate.roll .pl{filter:saturate(.6) brightness(.92)}
@keyframes pop{from{transform:scale(.93);opacity:.3}to{transform:none;opacity:1}}

/* stage */
.stage{position:relative;padding:28px 16px 52px;background:
  repeating-linear-gradient(135deg,rgba(255,255,255,.018) 0 2px,transparent 2px 5px),var(--panel)}
.stage::after{content:"";position:absolute;left:0;right:0;bottom:20px;height:3px;background:repeating-linear-gradient(90deg,var(--yellow) 0 24px,transparent 24px 48px);opacity:.55}
.stmeta{margin-top:18px;display:grid;gap:10px;justify-items:center;text-align:center}
.chips{display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:8px}
.chip{display:inline-block;padding:4px 11px;border-radius:999px;font:600 12px/1.3 var(--f-body);letter-spacing:.04em;color:var(--rc,var(--r0));border:1px solid color-mix(in srgb,var(--rc,var(--r0)) 55%,transparent);background:color-mix(in srgb,var(--rc,var(--r0)) 12%,transparent)}
.reg{color:var(--mute);font-size:14px}
.val{margin:0;color:var(--mute);font-size:13px}
.val b{color:var(--ink);font-weight:600;font-variant-numeric:tabular-nums}
.tags{display:flex;flex-wrap:wrap;gap:6px;justify-content:center}
.tags span{font-size:12px;color:var(--ink);background:var(--panel2);border:1px solid var(--line);padding:3px 8px;border-radius:5px}
.say{margin:0;color:var(--yellow);font-size:14px;font-weight:600}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:12px 18px;border-radius:10px;border:1px solid var(--line);background:var(--panel2);color:var(--ink);font-weight:600;cursor:pointer;text-align:center}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.pri{background:var(--yellow);border-color:var(--yellow);color:#191500;font-weight:700;font-size:17px;min-height:56px}
.btn.arm{border-color:#e5604f;color:#ff9a8c}
.btn.sm{min-height:40px;padding:8px 14px;font-size:14px}
.btns{display:grid;gap:10px}
.btns.two{grid-template-columns:1fr 1fr}

.stats{display:grid;grid-template-columns:repeat(3,1fr)}
.stats div{padding:2px 0 2px 14px;border-left:1px solid var(--line);min-width:0}
.stats div:first-child{padding-left:0;border-left:0}
.stats span{display:block;font:600 11px/1.2 var(--f-body);letter-spacing:.08em;text-transform:uppercase;color:var(--mute)}
.stats b{display:block;margin-top:4px;font:600 28px/1 var(--f-plate);font-variant-numeric:tabular-nums}

.odds{display:grid}
.odd{display:grid;grid-template-columns:14px 1fr auto 78px;gap:10px;align-items:center;padding:9px 0;border-top:1px solid var(--line)}
.odd:first-child{border-top:0}
.odd i{width:12px;height:12px;border-radius:3px}
.odd b{font:600 18px/1 var(--f-plate);font-variant-numeric:tabular-nums}
.odd em{font-style:normal;text-align:right;color:var(--mute);font-variant-numeric:tabular-nums;font-size:14px}
.note{margin:0;color:var(--mute);font-size:13px}
.note b{color:var(--ink);font-weight:600}
.alert{margin:0;padding:12px 14px;border:1px solid #6b3a35;background:rgba(229,96,79,.1);border-radius:10px;color:#ffb3a8;font-size:14px}

/* garage + lots */
.tools{display:grid;gap:10px}
.fchips{display:flex;flex-wrap:wrap;gap:6px}
.f{border:1px solid var(--line);background:transparent;color:var(--mute);border-radius:999px;padding:6px 12px;font-size:13px;cursor:pointer;min-height:34px}
.f[aria-pressed="true"]{color:var(--ink);background:var(--panel2);border-color:var(--mute)}
.f .dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px;background:var(--rc)}
.sorts{display:flex;gap:6px;align-items:center;color:var(--mute);font-size:13px;flex-wrap:wrap}
.glist{display:grid;gap:12px}
.gcard{display:grid;gap:12px;padding:14px;background:var(--panel);border:1px solid var(--line);border-radius:10px}
.gfoot{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;flex-wrap:wrap}
.gfoot .m{display:grid;gap:6px;min-width:0;flex:1 1 150px}
.gfoot .tags{justify-content:flex-start}
.gfoot .acts{display:grid;gap:8px}
.picker{display:flex;flex-wrap:wrap;gap:6px;padding-top:2px}
.empty{padding:28px 16px;text-align:center;color:var(--mute);border:1px dashed var(--line);border-radius:10px}
.cap{display:grid;gap:8px}
.mini{display:grid;grid-template-columns:1fr auto;gap:8px}
.mini input{min-height:44px;font:600 22px/1 var(--f-plate);text-align:right}
.big{font:600 28px/1 var(--f-plate);color:var(--yellow);font-variant-numeric:tabular-nums}

/* create + forms */
.form{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.field{display:grid;gap:6px;min-width:0}
.field.full{grid-column:1/-1}
.field label{font:600 11px/1 var(--f-body);letter-spacing:.09em;text-transform:uppercase;color:var(--mute)}
select,input{width:100%;min-height:48px;background:#0f1216;color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:10px 12px;font:16px var(--f-body)}
input#crDigits{font:600 28px/1 var(--f-plate);letter-spacing:.14em;text-align:center}
.price{display:flex;align-items:baseline;justify-content:space-between;gap:10px}
.price b{font:600 30px/1 var(--f-plate);color:var(--yellow);font-variant-numeric:tabular-nums}
.warn{margin:0;color:#ff9a8c;font-size:13px;min-height:1.4em}

/* upgrades */
.branch{display:grid;gap:10px}
.node{display:grid;gap:10px;padding:14px;border:1px solid var(--line);border-radius:10px;background:var(--panel)}
.node.d1{margin-left:18px;border-left:3px solid var(--blue)}
.node.d2{margin-left:36px;border-left:3px solid var(--blue)}
.node.lock{opacity:.55}
.node h3{margin:0;font:600 16px/1.3 var(--f-body)}
.node p{margin:0;color:var(--mute);font-size:13px}
.nhead{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.nhead span{font:600 18px/1 var(--f-plate);color:var(--mute);font-variant-numeric:tabular-nums}
.pips{display:flex;gap:4px;flex-wrap:wrap}
.pips i{width:18px;height:6px;border-radius:2px;background:#2c323c}
.pips i.on{background:var(--yellow)}
.req{color:#ff9a8c!important}

/* quests + achievements */
.q{display:grid;grid-template-columns:1fr auto;gap:6px 12px;align-items:center;padding:14px 0;border-top:1px solid var(--line)}
.q:first-child{border-top:0}
.q h3{margin:0;font:600 15px/1.3 var(--f-body)}
.q .bar{grid-column:1/-1}
.q.done h3{color:var(--mute)}
.ach{display:grid;grid-template-columns:26px 1fr auto;gap:4px 12px;align-items:start;padding:14px 0;border-top:1px solid var(--line)}
.ach:first-child{border-top:0}
.ach .ck{grid-row:span 3;width:24px;height:24px;border-radius:6px;border:1.5px solid var(--line);display:grid;place-items:center;font-size:14px;font-weight:700;color:#191500;margin-top:2px}
.ach.done .ck{background:var(--yellow);border-color:var(--yellow)}
.ach h3{margin:0;font:600 15px/1.3 var(--f-body)}
.ach p{margin:0;grid-column:2/4;color:var(--mute);font-size:13px}
.rw{font:600 18px/1.2 var(--f-plate);color:var(--yellow);font-variant-numeric:tabular-nums;white-space:nowrap}
.bar{grid-column:2/4;height:6px;border-radius:3px;background:#272d37;overflow:hidden;margin-top:6px}
.bar i{display:block;height:100%;background:var(--blue)}
.done .bar i,.q.ready .bar i{background:var(--yellow)}
.ach.done h3{color:var(--mute)}
.pv{grid-column:2/4;font-size:12px;color:var(--mute);font-variant-numeric:tabular-nums}
.q .pv{grid-column:auto}

/* regions */
.rgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.rt{display:grid;gap:2px;padding:12px;border:1px solid var(--line);border-radius:8px;background:var(--panel);opacity:.55;min-width:0}
.rt.got{opacity:1;border-color:#3a4a66;background:linear-gradient(180deg,rgba(44,123,229,.14),transparent 70%),var(--panel)}
.rt b{font:700 28px/1 var(--f-plate);letter-spacing:.06em}
.rt span{font-size:13px;color:var(--ink);overflow-wrap:anywhere}
.rt em{font-style:normal;font-size:12px;color:var(--mute)}
.prog{display:grid;gap:8px}
.prog .bar{margin:0}

/* rank */
.me{display:flex;align-items:baseline;justify-content:space-between;gap:12px}
.me b{font:600 34px/1 var(--f-plate);color:var(--yellow);font-variant-numeric:tabular-nums}
.rk{display:grid;grid-template-columns:30px 36px 1fr auto;gap:12px;align-items:center;padding:11px 0;border-top:1px solid var(--line);cursor:pointer;width:100%;background:none;border-left:0;border-right:0;border-bottom:0;text-align:left;border-radius:0;min-height:0}
.rkw:first-child .rk{border-top:0}
.rk .n{font:600 22px/1 var(--f-plate);color:var(--mute);text-align:center;font-variant-numeric:tabular-nums}
.rkw:nth-child(-n+3) .rk .n{color:var(--yellow)}
.rk img,.rk .av{width:36px;height:36px;border-radius:50%;background:var(--panel2);object-fit:cover;display:block}
.rk .who{min-width:0}
.rk .who b{display:block;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rk .who span{font-size:12px;color:var(--mute)}
.rk .sc{font:600 22px/1 var(--f-plate);font-variant-numeric:tabular-nums}
.rkw.mine{background:linear-gradient(90deg,rgba(255,210,63,.1),transparent);margin-inline:-16px;padding-inline:16px}
.pstat{display:grid;gap:12px;padding:4px 0 16px}
.kvs{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.kvs div{min-width:0}
.kvs span{display:block;font:600 11px/1.2 var(--f-body);letter-spacing:.08em;text-transform:uppercase;color:var(--mute)}
.kvs b{display:block;margin-top:3px;font:600 22px/1.1 var(--f-plate);font-variant-numeric:tabular-nums}

/* nav + toast */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:25;background:color-mix(in srgb,var(--asphalt) 94%,transparent);border-top:1px solid var(--line);padding:6px max(6px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(6px,env(safe-area-inset-left,0px));backdrop-filter:blur(8px)}
.nav>div{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(6,1fr);gap:2px}
.nav button{position:relative;display:grid;justify-items:center;gap:3px;padding:7px 0 5px;background:none;border:0;border-radius:8px;color:var(--mute);font:500 10.5px/1.1 var(--f-body);cursor:pointer;min-width:0}
.nav svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.nav button[aria-current="page"]{color:var(--yellow)}
.bdg{position:absolute;top:2px;left:calc(50% + 6px);background:var(--yellow);color:#191500;font:700 10px/1 var(--f-body);border-radius:9px;padding:2px 5px}
.toasts{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(80px + env(safe-area-inset-bottom,0px));z-index:40;display:grid;gap:8px;width:min(92vw,420px);pointer-events:none}
.toast{background:#2a303a;border:1px solid #3b4352;border-radius:8px;padding:10px 14px;font-size:14px;box-shadow:0 6px 20px rgba(0,0,0,.4);animation:pop .25s ease-out}
.toast.gold{border-color:var(--yellow)}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
@media (max-width:380px){.form{grid-template-columns:1fr}.odd{grid-template-columns:14px 1fr auto 64px}}
.lvl{font:600 11px/1 var(--f-body);color:var(--mute);border:1px solid var(--line);border-radius:999px;padding:4px 8px;margin-left:2px;white-space:nowrap;letter-spacing:0}
.brand{flex-wrap:wrap}
.chip.off{--rc:#ff7a6b}
.gcard.offc{border-color:#6b3a35}
.taxl{font-size:13px;color:var(--mute)}
.taxl.soon{color:#ffb37a}
.taxl.late{color:#ff9a8c}
.wall{display:grid;gap:14px}
.slot{display:grid;gap:10px;padding:14px;border:1px solid var(--line);border-radius:10px;background:var(--panel)}
.slotE{display:grid;place-items:center;min-height:90px;border:1px dashed var(--line);border-radius:10px;color:var(--mute);font-size:14px}
.pl.empty{background:#2a2f38}
.pl.empty .txt{color:#8d96a5;font:600 7cqw/1 var(--f-plate);letter-spacing:.12em;text-transform:uppercase}
.xp{display:grid;gap:8px}
.rwd{margin:4px 0 0;font-size:13px;color:var(--yellow)}
.pstat .wall{grid-template-columns:1fr}
.plate[data-sp] .pl{background:var(--spbg)}
.plate[data-sp] .txt{color:var(--spfg)}
.spl{position:absolute;top:.9cqw;right:1.8cqw;z-index:2;font:700 3cqw/1 var(--f-plate);font-style:normal;letter-spacing:.14em;text-transform:uppercase;color:var(--spfg);opacity:.8}
</style>

<header class="top"><div class="wrap row">
  <div class="brand"><span>Автономер</span><i>UA</i><span class="lvl" id="lvl"></span></div>
  <div class="wallet" aria-label="Гаманець"><b>₴</b><span id="coins">0</span></div>
</div></header>
<main class="wrap" id="view"></main>
<nav class="nav" aria-label="Розділи"><div id="nav"></div></nav>
<div class="toasts" id="toasts" role="status" aria-live="polite"></div>

<script>
(function(){
'use strict';
const $=s=>document.querySelector(s);
const L=['A','B','C','E','H','I','K','M','O','P','T','X'];
const ri=n=>Math.floor(Math.random()*n);
const pick=a=>a[ri(a.length)];
const fmt=n=>Number(n).toLocaleString('uk-UA');
const rdg=n=>String(ri(Math.pow(10,n))).padStart(n,'0');
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const num=x=>Math.max(0,Math.min(1e12,+x||0));

/* ---------- data ---------- */
const TIERS=[
  {n:'Звичайний',w:74,base:20,tx:.03,days:7},
  {n:'Незвичайний',w:19,base:80,tx:.03,days:7},
  {n:'Рідкісний',w:5.5,base:300,tx:.04,days:7},
  {n:'Епічний',w:1.2,base:1400,tx:.05,days:4},
  {n:'Легендарний',w:0.28,base:7000,tx:.07,days:2},
  {n:'Міфічний',w:0.02,base:40000,tx:.06,days:3}
];
const FR=[
  {n:'Сталева',price:400,inc:60},
  {n:'Бронзова',price:1500,inc:250},
  {n:'Золота',price:6000,inc:1100},
  {n:'Платинова',price:25000,inc:5500},
  {n:'Діамантова',price:100000,inc:25000}
];
const REGIONS=[

const TG={s4:'Чотири однакові цифри',n1:'Номер №1',low:'Малий номер',seq:'Цифри по порядку',y91:'Рік Незалежності',k:'Кругла тисяча',pal:'Дзеркальний номер',abab:'Повтор пари',aabb:'Дві пари',tri:'Три однакові цифри',h:'Круглі сотні',l0:'Нулі на початку',a3:'Три цифри підряд',dbl:'Подвійна серія',mt:'Серія як код регіону'};
function evaluate(code,dg,s){
  const d=dg.split('').map(Number),tg=[];
  const add=(k,t)=>tg.push({l:TG[k],t});
  const up=d.every((x,i)=>i===0||x-d[i-1]===1), dn=d.every((x,i)=>i===0||d[i-1]-x===1);
  if(new Set(d).size===1)add('s4',4);
  else if(dg==='0001')add('n1',4);
  else if(/^000\d$/.test(dg))add('low',3);
  else if(up||dn)add('seq',3);
  else if(dg==='1991')add('y91',2);
  else if(/^[1-9]000$/.test(dg))add('k',2);
  else if(d[0]===d[3]&&d[1]===d[2])add('pal',2);
  else if(d[0]===d[2]&&d[1]===d[3])add('abab',2);
  else if(d[0]===d[1]&&d[2]===d[3])add('aabb',2);
  else if(/(\d)\1\1/.test(dg))add('tri',2);
  else if(/00$/.test(dg))add('h',1);
  else if(/^00/.test(dg))add('l0',1);
  else if(/012|123|234|345|456|567|678|789|987|876|765|654|543|432|321|210/.test(dg))add('a3',1);
  if(s[0]===s[1])add('dbl',1);
  if(s===code)add('mt',2);
  let t=tg.reduce((m,x)=>Math.max(m,x.t),0);
  if(tg.filter(x=>x.t>=2).length>=2)t=Math.min(5,t+1);
  return {t,tg};
}
function h32(str){let h=2166136261;for(let i=0;i<str.length;i++){h^=str.charCodeAt(i);h=Math.imul(h,16777619)}return h>>>0}
/* ринкова вартість: база рідкості, множник за номером і бонус за кількість особливостей */
function plateValue(c,d,s,t,ntags){
  const f=0.85+((h32(c+d+s)%1000)/1000)*0.5, ex=Math.max(0,ntags-1)*0.12;
  return Math.max(5,Math.round(TIERS[t].base*f*(1+ex)));
}

const abD=()=>{const a=ri(10),b=other(a);return ''+a+b+a+b};
const aaD=()=>{const a=ri(10),b=other(a);return ''+a+a+b+b};
const triD=()=>{const a=ri(10),b=other(a);return ri(2)?''+a+a+a+b:''+b+a+a+a};
const dblL=()=>{const x=pick(L);return x+x};

  1:[()=>({d:rdg(2)+'00'}),()=>({d:'00'+rdg(2)}),
     ()=>{const s=ri(8),t=''+s+(s+1)+(s+2);return {d:ri(2)?t+ri(10):ri(10)+t}},
     ()=>({d:rdg(4),s:'dbl'})],
  2:[()=>({d:triD()}),()=>({d:palD()}),()=>({d:abD()}),()=>({d:aaD()}),

     ()=>({d:palD(),s:'m'}),()=>({d:triD(),s:'m'})],
  4:[()=>({d:'0001'}),()=>({d:String(1+ri(9)).repeat(4)})],

/* перевірка номера з чужих даних: усе перераховується локально */
function safePlate(o){
  if(!o||typeof o!=='object')return null;
  const c=String(o.c||''),d=String(o.d||''),s=String(o.s||'');
  if(!/^[A-Z]{2}$/.test(c)||!/^\d{4}$/.test(d)||!/^[A-Z]{2}$/.test(s))return null;
  const r=REGIONS.findIndex(R=>R.c.indexOf(c)>=0);if(r<0)return null;
  if(typeof o.sp==='string'&&Object.prototype.hasOwnProperty.call(SP,o.sp)){
    return {c,d,s,t:SP[o.sp].t,r,tg:[SP[o.sp].n],v:spValue(o.sp,c,d,s),own:0,sp:o.sp};
  }
  const ev=evaluate(c,d,s),own=o.own?1:0,base=plateValue(c,d,s,ev.t,ev.tg.length);
  return {c,d,s,t:ev.t,r,tg:ev.tg.map(x=>x.l),v:own?base*OWN_MULT:base,own,sp:null};
}

function toast(msg,gold){
  const el=document.createElement('div');el.className='toast'+(gold?' gold':'');el.textContent=msg;
  const box=$('#toasts');box.appendChild(el);
  while(box.children.length>3)box.removeChild(box.firstChild);

}

function makePlate(ft){
  if(ft==null&&Math.random()<SPCH)return makeSpecial();
  let t=0;
  if(ft!=null)t=ft;
  else{const pr=probs();let r=Math.random()*100;for(;t<5;t++){r-=pr[t];if(r<0)break}}
  for(let i=0;i<400;i++){
    const o=pick(G[t])(),rg=ri(REGIONS.length),c=pick(REGIONS[rg].c);
    const s=o.s==='dbl'?dblL():o.s==='m'?c:rs();
    const ev=evaluate(c,o.d,s);
    if(ev.t===t||i===399){
      return {c,d:o.d,s,t:ev.t,r:rg,tg:ev.tg.map(x=>x.l),v:plateValue(c,o.d,s,ev.t,ev.tg.length)};
    }
  }
}
function discover(p){
  if(S.regs.indexOf(p.r)<0)S.regs.push(p.r);
  p.tg.forEach(l=>{if(S.tags.indexOf(l)<0&&SPN.indexOf(l)<0)S.tags.push(l)});if(p.sp&&S.sps.indexOf(p.sp)<0)S.sps.push(p.sp);
  if(p.d.indexOf('777')>=0)S.f7=1;
  S.best=Math.max(S.best,p.t);
}
function toGarage(p){p.id=S.next++;p.at=Date.now();p.off=0;p.due=Date.now()+periodMs(p);S.garage.unshift(p)}
function payout(p){
  const g=Math.round(sellPrice(p)*(boostOn()?2:1));
  S.coins+=g;S.sold++;qAdd('sell',1);qAdd('earn',g);return g;
}
function sellGarage(id){
  const i=S.garage.findIndex(p=>p.id===id);if(i<0)return;
  settle();
  const p=S.garage[i];releaseFrame(p);S.garage.splice(i,1);
  const g=payout(p);
  if(S.cur===id)S.cur=null;

  toast('Продано '+p.c+' '+p.d+' '+p.s+' · +'+fmt(g)+' ₴');
}

const taxDue=()=>S.garage.filter(p=>!p.off&&p.due-Date.now()<=DAYMS);
const taxWarn=()=>S.garage.filter(p=>p.off||p.due-Date.now()<=12*3600e3).length;
function payTax(id){
  const p=S.garage.find(x=>x.id===id);if(!p||p.off)return;
  if(p.due-Date.now()>2*periodMs(p)){toast('Наперед можна сплатити не більше ніж на три періоди.');return}
  const t=taxOf(p);
  if(S.coins<t){toast('Не вистачає грошей.');return}
  S.coins-=t;p.due+=periodMs(p);S.taxp++;qAdd('tax',1);check();save();
  toast('Податок сплачено · −'+fmt(t)+' ₴');
}
function payAllTax(ahead){
  const list=(ahead?S.garage.filter(p=>!p.off&&p.due-Date.now()<=periodMs(p)):taxDue()).sort((a,b)=>a.due-b.due);
  let n=0,sum=0;
  for(const p of list){
    const t=taxOf(p);if(S.coins<t)break;
    S.coins-=t;p.due+=periodMs(p);S.taxp++;qAdd('tax',1);n++;sum+=t;
  }
  if(n){check();save();toast('Сплачено податків: '+n+' · −'+fmt(sum)+' ₴')}
  else toast('Не вистачає грошей.');
}
function restorePlate(id){
  const p=S.garage.find(x=>x.id===id);if(!p||!p.off)return;
  const c=restoreCost(p);
  if(S.coins<c){toast('Не вистачає грошей.');return}
  S.coins-=c;p.off=0;p.due=Date.now()+periodMs(p);
  check();save();toast('Номер відновлено · −'+fmt(c)+' ₴',true);
}
function stateSell(id){
  const i=S.garage.findIndex(p=>p.id===id);if(i<0||!S.garage[i].off)return;
  const p=S.garage[i],g=Math.round(p.v*0.5);
  S.garage.splice(i,1);if(S.cur===id)S.cur=null;
  S.coins+=g;S.sold++;S.st++;qAdd('sell',1);qAdd('earn',g);
  check();save();toast('Продано державі · +'+fmt(g)+' ₴');
}
function taxTick(){
  const now=Date.now();
  if(lv('acct')>0&&S.apay){
    let n=0,sum=0;
    S.garage.forEach(p=>{
      if(p.off||p.due-now>DAYMS||(lv('acct')<2&&p.t>2))return;
      const t=taxOf(p);if(S.coins<t)return;
      S.coins-=t;p.due+=periodMs(p);S.taxp++;n++;sum+=t;qAdd('tax',1);
    });
    if(n){check();save();toast('Бухгалтер сплатив податків: '+n+' · −'+fmt(sum)+' ₴')}
  }
  const late=S.garage.filter(p=>!p.off&&p.due<=now);
  if(!late.length)return;
  settle();
  late.forEach(p=>{p.off=1;const i=slotOf(p);if(i>=0)S.slots[i].pid=null});
  save();toast('Знято з обліку номерів: '+late.length+'. Відновлення у вкладці «Гараж».',true);
  if(tab==='garage'||tab==='gen')softRender();else renderNav();
}

/* --- db wiring --- */
function loadProfiles(){
  if(!USERX)return;
  const ids=[];board.forEach(b=>ids.push(b.id));market.forEach(l=>{ids.push(l.seller);if(l.bidder)ids.push(l.bidder)});
  const u=Array.from(new Set(ids)),key=u.join(',');
  if(!u.length||key===profKey)return;
  profKey=key;
  USERX.profiles(u).then(ps=>{profCache=ps;paintRank();if(tab==='market')softRender()});
}
function normLot(id,x){
  if(!x)return null;
  const plate=safePlate(x.plate);if(!plate)return null;
  return {id,seller:String(x.seller||''),kind:x.kind==='auction'?'auction':'fixed',plate,price:num(x.price),bid:num(x.bid),bidder:x.bidder?String(x.bidder):null,bids:num(x.bids),ends:num(x.ends),status:String(x.status||''),fin:num(x.fin),created:num(x.created)};
}
function initCloud(){
  if(!window.claude||!claude.use){cloud.st='off';return}
  Promise.all([claude.use('user'),claude.use('db')]).then(async r=>{
    USERX=r[0];DBX=r[1];
    if(!DBX){cloud.st='off';if(tab==='rank'||tab==='market')render();return}
    if(USERX){myId=await USERX.id();const w=await USERX.can('data.write');cloud.ro=(w===false)}
    cloud.st='ok';
    const timer=setTimeout(()=>{if(cloud.st==='init'){cloud.st='err';if(tab==='rank'||tab==='market')render()}},10000);
    DBX.collection('board').limit(300).onSnapshot(snap=>{
      clearTimeout(timer);
      board=snap.docs.map(d=>{
        const x=d.data()||{},bp0=x.bp&&safePlate(x.bp);
        return {id:d.id,score:num(x.score),coins:num(x.coins),n:num(x.n),gen:num(x.gen),sold:num(x.sold),ach:num(x.ach),regs:num(x.regs),best:typeof x.best==='number'?Math.max(-1,Math.min(5,Math.floor(x.best))):-1,bv:num(x.bv),fi:num(x.fi),cu:num(x.cu),ms:num(x.ms),lvl:num(x.lvl),wl:wlOf(x.wl),
          bp:bp0?{c:bp0.c,d:bp0.d,s:bp0.s,t:bp0.t,sp:bp0.sp,f:Math.max(-1,Math.min(4,Math.floor(+x.bp.f)||-1))}:null};
      });
      cloud.st='ok';loadProfiles();
      if(tab==='rank')softRender();
    },()=>{clearTimeout(timer);cloud.st='err';if(tab==='rank'||tab==='market')render()});
    DBX.collection('market').limit(300).onSnapshot(snap=>{
      market=snap.docs.map(d=>normLot(d.id,d.data())).filter(Boolean);
      loadProfiles();mkProcess();
      if(tab==='market')softRender();
    },()=>{});
    doPush();
    if(tab==='rank'||tab==='market')render();
  }).catch(()=>{cloud.st='off'});
}
let pushT=null,pushing=false,lastKey='';
function myStats(){
  let bv=0,bp=null;
  S.garage.forEach(p=>{if(p.v>bv){bv=p.v;bp={c:p.c,d:p.d,s:p.s,t:p.t,f:frameOf(p),sp:p.sp||null}}});
  const wl=S.slots.map(s=>{
    const p=s.pid&&s.f>=0?S.garage.find(x=>x.id===s.pid):null;
    return p?{c:p.c,d:p.d,s:p.s,f:s.f,own:p.own?1:0,sp:p.sp||null}:null;
  }).filter(Boolean);
  return {score:score(),coins:S.coins,n:S.garage.length,gen:S.gen,sold:S.sold,ach:Object.keys(S.ach).length,regs:S.regs.length,best:S.best,bv,bp,fi:Math.round(rate()),cu:S.custom,ms:S.mk.sold,lvl:lvl(),wl};
}
function schedulePush(){
  if(!DBX||!myId||cloud.ro)return;
  clearTimeout(pushT);pushT=setTimeout(doPush,4000);
}
async function doPush(){
  if(!DBX||!myId||cloud.ro)return;
  if(pushing){schedulePush();return}
  const st=myStats(),key=JSON.stringify(st);
  if(key===lastKey)return;
  pushing=true;
  try{st.t=Date.now();await DBX.doc('board/'+myId).set(st);lastKey=key}
  catch(e){if(e&&e.code==='invalid_argument'){cloud.ro=true;if(tab==='rank'||tab==='market')render()}}
  finally{pushing=false}
}

/* --- market actions --- */
const DAY=24*3600e3;
async function withLease(id,fn){
  const ref=DBX.doc('market/'+id);
  const lease=await ref.acquire({holder:myId,ttlMs:8000});
  if(!lease.acquired){toast('Лот зараз оновлює інший гравець. Спробуй ще раз.');return}
  const snap=await ref.get();
  if(!snap.exists){toast('Лот уже недоступний.');return}
  const l=normLot(id,snap.data());
  if(!l){toast('Лот пошкоджений.');return}
  return fn(ref,l);
}
async function createListing(){
  if(!DBX||!myId||cloud.ro){toast('Для ринку потрібен доступ «Учасник».');return}
  const p=S.garage.find(x=>String(x.id)===String(mf.pid));
  const price=Math.floor(+mf.price);
  if(!p){toast('Обери номер із гаража.');return}
  if(p.off){toast('Номер знято з обліку. Спершу відновити його в гаражі.');return}
  if(!(price>=1)||price>1e9){toast('Вкажи ціну від 1 ₴.');return}
  if(mine().length>=6){toast('Забагато активних лотів. Максимум 6.');return}
  const hours=[1,6,24].indexOf(+mf.hours)>=0?+mf.hours:6,kind=mf.kind==='auction'?'auction':'fixed';
  const id=String(myId).slice(-8)+Date.now().toString(36)+ri(1296).toString(36);
  const doc={seller:myId,kind,plate:{c:p.c,d:p.d,s:p.s,own:p.own?1:0,sp:p.sp||null},price,bid:0,bidder:null,bids:0,ends:kind==='auction'?Date.now()+hours*3600e3:0,status:'open',created:Date.now()};
  try{await DBX.doc('market/'+id).set(doc)}catch(e){toast('Не вдалося виставити лот.');return}
  settle();releaseFrame(p);
  S.garage=S.garage.filter(x=>x.id!==p.id);if(S.cur===p.id)S.cur=null;
  mf.pid='';mf.price='';
  save();toast('Лот виставлено: '+p.c+' '+p.d+' '+p.s,true);render();
}
async function cancelLot(id){
  if(!DBX||!myId)return;
  try{
    await withLease(id,async(ref,l)=>{
      if(l.seller!==myId||l.status!=='open'||l.bidder){toast('Цей лот зняти не можна.');return}
      await ref.delete();
      toGarage(Object.assign({},l.plate,{fr:null}));save();toast('Номер повернуто в гараж.');render();
    });
  }catch(e){toast('Не вдалося зняти лот.')}
}
async function buyLot(id){
  if(!DBX||!myId||cloud.ro){toast('Для ринку потрібен доступ «Учасник».');return}
  try{
    await withLease(id,async(ref,l)=>{
      if(l.status!=='open'||l.kind!=='fixed'){toast('Лот уже недоступний.');return}
      if(l.seller===myId){toast('Це твій лот.');return}
      if(S.coins<l.price){toast('Не вистачає грошей.');return}
      if(S.garage.length>=cap()){toast('У гаражі немає місця.');return}
      await ref.update({status:'sold',buyer:myId,fin:l.price});
      S.coins-=l.price;S.mk.bought++;qAdd('mkt',1);discover(l.plate);toGarage(Object.assign({},l.plate,{fr:null}));
      check();save();toast('Куплено '+l.plate.c+' '+l.plate.d+' '+l.plate.s,true);render();
    });
  }catch(e){toast('Не вдалося купити лот.')}
}
async function placeBid(id){
  if(!DBX||!myId||cloud.ro){toast('Для ринку потрібен доступ «Учасник».');return}
  const amt=Math.floor(+(bidIn[id]!=null?bidIn[id]:0));
  try{
    await withLease(id,async(ref,l)=>{
      if(l.status!=='open'||l.kind!=='auction'||l.ends<=Date.now()){toast('Аукціон завершено.');return}
      if(l.seller===myId){toast('Це твій лот.');return}
      if(!(amt>=minBid(l))){toast('Мінімальна ставка: '+fmt(minBid(l))+' ₴.');return}
      if(S.coins<amt){toast('Не вистачає грошей на таку ставку.');return}
      await ref.update({bid:amt,bidder:myId,bids:l.bids+1});
      delete bidIn[id];toast('Ставку '+fmt(amt)+' ₴ прийнято.',true);
    });
  }catch(e){toast('Не вдалося зробити ставку.')}
}
/* дії, які гра виконує сама: виплата продавцю, повернення номера, розрахунок переможця */
async function mkProcess(){
  if(mkBusy||!DBX||!myId||cloud.ro)return;
  mkBusy=true;
  try{
    const now=Date.now();
    for(const l of market.slice()){
      const key=l.id+':'+l.status+':'+l.bid;
      if(mkDone.has(key))continue;
      const ref=DBX.doc('market/'+l.id);
      if(l.seller===myId){
        if(l.status==='sold'){
          mkDone.add(key);
          await ref.delete();
          const g=Math.floor((l.fin||l.price)*0.95);
          S.coins+=g;S.mk.sold++;qAdd('mkt',1);check();save();toast('Лот продано · +'+fmt(g)+' ₴ (після комісії)',true);softRender();
        }else if(l.status==='failed'||(l.status==='open'&&l.kind==='auction'&&((l.ends<now&&!l.bidder)||(l.bidder&&l.ends+DAY<now)))){
          mkDone.add(key);
          await ref.delete();
          toGarage(Object.assign({},l.plate,{fr:null}));save();toast('Номер повернуто з ринку в гараж.');softRender();
        }
      }else if(l.status==='open'&&l.kind==='auction'&&l.ends<now&&l.bidder===myId){
        mkDone.add(key);
        await claimWin(l.id);
      }
    }
  }catch(e){}
  finally{mkBusy=false}
}
async function claimWin(id){
  await withLease(id,async(ref,l)=>{
    if(l.status!=='open'||l.bidder!==myId||l.ends>=Date.now())return;
    if(S.coins>=l.bid){
      await ref.update({status:'sold',buyer:myId,fin:l.bid});
      S.coins-=l.bid;S.mk.bought++;qAdd('mkt',1);discover(l.plate);toGarage(Object.assign({},l.plate,{fr:null}));
      check();save();toast('Виграно аукціон: '+l.plate.c+' '+l.plate.d+' '+l.plate.s,true);softRender();
    }else{
      await ref.update({status:'failed'});
      toast('Аукціон виграно, але не вистачило грошей. Номер повернуто продавцю.');
    }
  });
}

function arm(btn,label,fn){
  if(btn.dataset.armed){fn();return}
  btn.dataset.armed='1';btn.dataset.old=btn.textContent;btn.textContent=label;btn.classList.add('arm');
  setTimeout(()=>{
    if(btn.isConnected&&btn.dataset.armed){delete btn.dataset.armed;btn.textContent=btn.dataset.old;btn.classList.remove('arm')}
  },3000);
}

function generate(silent){
  if(!canGen())return;
  busy=true;tmp=null;tickBtn();
  const host=$('#host'),final=makePlate();
  const reduce=silent||(window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches);
  let n=0;const total=reduce?0:11;
  function step(){
    if(n++<total){
      if(host&&host.isConnected)host.innerHTML=plateHTML(pick(REGIONS[ri(REGIONS.length)].c),rdg(4),rs(),0,'roll');
      setTimeout(step,55);
    }else commit(final);
  }
  step();
}
function commit(p){
  S.gen++;qAdd('gen',1);S.cnt[p.t]++;addXp(1+[0,2,8,30,100,400][p.t]);if(p.t>=3)qAdd('epic',1);
  if(p.t>=1)qAdd('unc',1);
  if(p.t>=2)qAdd('rare',1);
  discover(p);
  if(S.auto&&p.t<lv('auto')){
    const g=payout(p);tmp={p,gain:g};S.cur=null;
  }else{
    toGarage(p);S.cur=p.id;
  }
  check();save();busy=false;cdUntil=Date.now()+cdMs();
  if(p.t>=2)toast(TIERS[p.t].n+' номер: '+p.c+' '+p.d+' '+p.s,true);
  if(tab==='gen'){render();const pl=$('#host .plate');if(pl)pl.classList.add('pop')}
  else{softRender()}
}
let nextAuto=0;
function autogenTick(){
  const l=lv('agen');if(!l||!S.agen||!canGen())return;
  if(Date.now()<nextAuto)return;
  nextAuto=Date.now()+[10000,6000,3000][l-1];
  generate(true);
}

document.addEventListener('click',e=>{
  const b=e.target.closest('[data-act]');if(!b||b.disabled)return;
  const a=b.dataset.act;
  if(a==='tab'){tab=b.dataset.tab;gshow=30;render();window.scrollTo(0,0)}
  else if(a==='sub'){sub[b.dataset.g]=b.dataset.k;render()}
  else if(a==='gen')generate(false);
  else if(a==='autotoggle'){S.auto=!S.auto;save();render()}
  else if(a==='agentoggle'){S.agen=!S.agen;save();render()}
  else if(a==='apaytoggle'){S.apay=!S.apay;save();render()}
  else if(a==='sell'){
    const id=+b.dataset.id,p=S.garage.find(x=>x.id===id);if(!p)return;
    const go=()=>{sellGarage(id);render()};
    if(p.off)return;
    if(p.t>=2||slotOf(p)>=0)arm(b,'Точно продати?',go);else go();
  }
  else if(a==='sellc'){
    arm(b,'Підтвердити продаж?',()=>{
      settle();
      const keep=[];let gain=0,cnt=0;
      S.garage.forEach(p=>{if(p.t===0&&!p.off){releaseFrame(p);gain+=payout(p);cnt++}else keep.push(p)});
      S.garage=keep;
      if(!S.garage.some(p=>p.id===S.cur))S.cur=null;
      check();save();toast('Продано '+cnt+' звичайних · +'+fmt(gain)+' ₴');render();
    });
  }
  else if(a==='filter'){gf=+b.dataset.t;gshow=30;render()}
  else if(a==='sort'){gs=b.dataset.s;render()}
  else if(a==='more'){gshow+=30;render()}
  else if(a==='wf'||a==='wp'){
    const i=+b.dataset.i,k=a==='wf'?'f':'p';
    wallPick=(wallPick&&wallPick.i===i&&wallPick.k===k)?null:{i,k};render();
  }
  else if(a==='wsetf'){setFrame(+b.dataset.i,+b.dataset.f);check();save();render()}
  else if(a==='wsetp'){setPlate(+b.dataset.i,+b.dataset.id);check();save();render()}
  else if(a==='wclr'){const s=S.slots[+b.dataset.i];if(s&&s.pid){settle();s.pid=null;save();render()}}
  else if(a==='tax'){payTax(+b.dataset.id);render()}
  else if(a==='taxall'){payAllTax(!!b.dataset.ahead);render()}
  else if(a==='restore'){restorePlate(+b.dataset.id);render()}
  else if(a==='tostate'){
    const id=+b.dataset.id,p=S.garage.find(x=>x.id===id);if(!p||!p.off)return;
    const go=()=>{stateSell(id);render()};
    if(p.t>=2)arm(b,'Точно продати державі?',go);else go();
  }
  else if(a==='fbuy'){
    const f=+b.dataset.f;if(S.coins<FR[f].price)return;
    S.coins-=FR[f].price;S.frames[f]=(S.frames[f]||0)+1;S.fb++;check();save();toast(FR[f].n+' рамка куплена',true);render();
  }
  else if(a==='collect'){
    settle();const raw=Math.floor(S.bank);
    if(raw>=1){
      const g=raw*(boostOn()?2:1);
      S.bank-=raw;S.coins+=g;S.fcol+=g;check();save();
      toast('Зібрано з вітрини · +'+fmt(g)+' ₴',boostOn());render();
    }
  }
  else if(a==='rand'){cr.r=ri(REGIONS.length);cr.c=ri(REGIONS[cr.r].c.length);cr.d=rdg(4);cr.a=pick(L);cr.b=pick(L);render()}
  else if(a==='buy'){
    const st=crState();if(!st.can)return;
    S.coins-=st.price;S.custom++;
    const p={c:st.code,d:cr.d,s:st.s,t:st.ev.t,r:cr.r,tg:st.ev.tg.map(x=>x.l),v:st.v,own:1};
    discover(p);toGarage(p);qAdd('custom',1);check();save();
    toast('Номер '+st.code+' '+cr.d+' '+st.s+' тепер у гаражі.',true);render();
  }
  else if(a==='upg'){
    const u=UPG.find(x=>x.k===b.dataset.k);if(!u)return;
    const l=lv(u.k);
    if(l>=u.max)return;
    if(u.req&&lv(u.req[0])<u.req[1])return;
    const c=u.cost[l];if(S.coins<c)return;
    S.coins-=c;S.up[u.k]=l+1;check();save();
    toast(u.t+': рівень '+(l+1),true);render();
  }
  else if(a==='claim'){
    ensureQ();
    const Q=b.dataset.w?S.wq:S.q,q=Q.list[+b.dataset.i];
    if(q&&q.p>=q.g&&!q.c){
      if(q.rw.pl!=null&&S.garage.length>=cap()){toast('Для нагороди потрібне вільне місце в гаражі.');return}
      q.c=1;if(b.dataset.w)S.wd++;else S.qd++;
      giveReward(q.rw);check();save();
      toast('Нагорода: '+rwText(q.rw),true);render();
    }
  }
  else if(a==='cat'){rkCat=b.dataset.k;selP=null;render()}
  else if(a==='pl'){selP=(selP===b.dataset.id)?null:b.dataset.id;paintRank()}
  else if(a==='mkf'){mkF=b.dataset.k;render()}
  else if(a==='list')createListing();
  else if(a==='cancel')cancelLot(b.dataset.id);
  else if(a==='buylot')buyLot(b.dataset.id);
  else if(a==='bid')placeBid(b.dataset.id);
});
document.addEventListener('change',e=>{
  const id=e.target.id;
  if(id==='crRegion'){cr.r=+e.target.value;cr.c=0;render()}
  else if(id==='crCode'){cr.c=+e.target.value;updateCreate()}
  else if(id==='crA'){cr.a=e.target.value;updateCreate()}
  else if(id==='crB'){cr.b=e.target.value;updateCreate()}
  else if(id==='mfPlate'){mf.pid=e.target.value;const p=S.garage.find(x=>String(x.id)===String(mf.pid));if(p&&!mf.price)mf.price=String(p.v);render()}
  else if(id==='mfKind'){mf.kind=e.target.value;render()}
  else if(id==='mfHours'){mf.hours=e.target.value}
});
document.addEventListener('input',e=>{
  const id=e.target.id||'';
  if(id==='crDigits'){
    const v=e.target.value.replace(/\D/g,'').slice(0,4);
    if(v!==e.target.value)e.target.value=v;
    cr.d=v;updateCreate();
  }else if(id==='mfPrice'){
    const v=e.target.value.replace(/\D/g,'').slice(0,10);
    if(v!==e.target.value)e.target.value=v;
    mf.price=v;
  }else if(id.indexOf('bid_')===0){
    const v=e.target.value.replace(/\D/g,'').slice(0,10);
    if(v!==e.target.value)e.target.value=v;
    bidIn[id.slice(4)]=v;
  }
});

setInterval(()=>{
  const el=$('#bankAmt');if(el)el.textContent=fmt(Math.floor(bankNow()));
  autogenTick();taxTick();hdr();
},1000);
setInterval(()=>{mkProcess();if(tab==='market')softRender()},20000);

ensureQ();taxTick();check();save();render();initCloud();
})();
</script>
